<html lang="en"><head><meta charset="utf-8">

<title>Sabaq – Academy dashboards</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--sf:#fff;--ink:#14282b;--mut:#5d7073;--ln:#d8e1df;--pri:#0f6b6f;--pri2:#e0f0ef;--okc:#1c6b3c;--okb:#dcf1e3;--wc:#8a5d00;--wb:#fbf0d2;--bc:#a8322d;--bb:#f9e1df;--sb:#0b3335;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1819;--sf:#142526;--ink:#e3eeed;--mut:#93a9ab;--ln:#27403f;--pri:#58c0c4;--pri2:#173a3b;--okc:#7fd6a0;--okb:#173a28;--wc:#f0c365;--wb:#3a2f12;--bc:#f0928d;--bb:#3d1a19}}
:root[data-theme="dark"]{--bg:#0d1819;--sf:#142526;--ink:#e3eeed;--mut:#93a9ab;--ln:#27403f;--pri:#58c0c4;--pri2:#173a3b;--okc:#7fd6a0;--okb:#173a28;--wc:#f0c365;--wb:#3a2f12;--bc:#f0928d;--bb:#3d1a19}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,sans-serif}
h1,h2{font-family:Newsreader,Georgia,serif;font-weight:600;margin:0}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
aside{background:var(--sb);color:#d5e6e4;padding:22px 16px;display:flex;flex-direction:column;gap:6px}
aside h1{font-size:28px;color:#fff}aside .ac{margin:0 0 18px;color:#8fb3b0;font-size:13px}
aside button{all:unset;cursor:pointer;padding:9px 12px;border-radius:6px;color:#cfe3e1}
aside button:hover{background:#17484b}aside button.on{background:#e8f4f2;color:#0b3335;font-weight:600}
aside button:focus-visible,.st:focus-visible,.btn:focus-visible{outline:2px solid #f0c365;outline-offset:2px}
aside .as{margin-top:auto;padding-top:18px;font-size:13px;color:#8fb3b0}
.sw{display:flex;gap:4px;margin-top:6px}.sw button{flex:1;text-align:center;border:1px solid #2c5b5d;padding:7px 4px;font-size:13px}
main{padding:28px 32px;min-width:0}
main h1{font-size:30px}.sub{color:var(--mut);margin:2px 0 20px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
select,input{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:7px 9px;min-width:0}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:1px}
.btn{font:inherit;cursor:pointer;background:var(--pri);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-weight:500}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn.pp{background:#e8a317!important;color:#1b1200!important;border:0;font-weight:600}.btn.pp:hover{filter:brightness(1.08)}
[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#0b2224}
.two{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
.list{display:flex;flex-direction:column;gap:6px}
.st{all:unset;cursor:pointer;display:block;background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--ln);border-radius:4px 10px 10px 4px;padding:10px 12px}
.st.on{border-left-color:var(--pri);background:var(--pri2)}.st b{display:block}.st span{color:var(--mut);font-size:13px}.st small{display:block;color:var(--mut);font-size:12px}
.rh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}
.rh h2{font-size:24px}.rh p{margin:0;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--pri2);color:var(--pri);border-radius:99px;padding:3px 11px;font-size:13px;font-weight:500}
.wrap{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:10px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--ln);vertical-align:top}
th{font-weight:600;font-size:13px;color:var(--mut);background:var(--bg);white-space:nowrap}
.rt{min-width:960px}td[contenteditable]:hover{background:var(--pri2);cursor:text}td[contenteditable]:focus{outline:2px solid var(--pri);outline-offset:-2px}
td small{color:var(--mut)}
tr.eow td{background:#c9473f;color:#fff;text-align:center;font-weight:600;padding:5px}
.b{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:500}
.b.ok{background:var(--okb);color:var(--okc)}.b.warn{background:var(--wb);color:var(--wc)}.b.bad{background:var(--bb);color:var(--bc)}.b.n{background:var(--bg);color:var(--mut)}
details.add{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 14px;margin-bottom:12px}
details summary{cursor:pointer;font-weight:600;color:var(--pri)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.fg label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}
.err{color:var(--bc);margin-left:10px}
.hint{color:var(--mut);font-size:13px;margin:8px 0 0}
.nums{display:flex;flex-wrap:wrap;margin:0 0 24px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.nums div{flex:1;min-width:150px;padding:16px 20px;border-right:1px solid var(--ln)}.nums div:last-child{border:0}
.nums b{display:block;font:600 34px/1.1 Newsreader,Georgia,serif}.nums span{color:var(--mut);font-size:13px}
.empty{color:var(--mut);padding:30px;text-align:center}
td input[type=time],td select{width:100%}
.ttb{background:var(--pri);color:#fff;padding:9px 14px;border-radius:10px;font-weight:600}
.tt{min-width:1900px}.tt th,.tt td{white-space:nowrap;text-align:center;padding:8px 10px;border:1px solid var(--ln);vertical-align:middle}
.tt th small{font-weight:400}.tt th.dy{position:sticky;left:0;z-index:1;background:#f59a0b;color:#1b1200;text-align:left;min-width:112px}.tt th.dy small{display:block}
.tt .c{min-width:108px;color:#1d2a1f;font-weight:500}.gr{background:#9bbb59}.pk{background:#e59a9a;cursor:pointer}.ty{background:#ffe94d;cursor:pointer}.pk:hover,.ty:hover{filter:brightness(.93)}
.tt td.nt{min-width:200px;text-align:left;color:var(--bc);background:var(--sf)}.tt tr.today th.dy{box-shadow:inset 5px 0 #14282b}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:26px}.br{display:grid;grid-template-columns:130px 1fr 34px;gap:8px;align-items:center;margin:7px 0}.br i{display:block;height:10px;border-radius:5px;background:var(--pri)}.br b{text-align:right}
@media(max-width:860px){.two2{grid-template-columns:1fr}}
td input[type=date]{width:100%}.rt td select{margin-bottom:4px}.gr.ed{cursor:pointer}.gr.ed:hover{filter:brightness(.93)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}.mc{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:20px;width:min(380px,100%)}
.ml{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);margin-bottom:10px}.ml select{width:100%}.dys{display:flex;gap:12px;flex-wrap:wrap;color:var(--ink)}.dys label{display:flex;flex-direction:row;gap:4px;align-items:center}
@media(min-width:861px){#app{height:100vh;height:100dvh;grid-template-rows:minmax(0,1fr)}aside{overflow-y:auto}main{overflow-y:auto}
main.fit{display:flex;flex-direction:column;overflow:hidden}main.fit>*{flex:none}main.fit>.two{flex:1 1 0;min-height:0;align-items:stretch;grid-template-rows:minmax(0,1fr)}main.fit>.two>*{min-height:0;overflow-y:auto}
main.fit>.wrap{flex:0 1 auto;min-height:0;overflow:auto}main.fit>.wrap thead th{position:sticky;top:0;z-index:1}}
@media print{#app{height:auto!important;display:block!important}main,main.fit{overflow:visible!important;display:block!important}main.fit>.two>*{overflow:visible!important}}
#pr{display:none}
@page{size:A4;margin:14mm}@media print{body{background:#fff}#app{display:none!important}#pr.show{position:static!important;background:#fff!important;padding:0!important;overflow:visible!important}.pbar{display:none!important}.sheet{box-shadow:none!important;padding:0!important;max-width:none!important}}
#pr.show{display:block;position:fixed;inset:0;overflow:auto;background:#e9eeed;z-index:30;padding:16px}.sheet{background:#fff;max-width:794px;margin:0 auto;padding:28px;box-shadow:0 2px 12px rgba(0,0,0,.25)}.pbar{max-width:794px;margin:0 auto 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pbar .hint{margin:0}
#pr{color:#14282b;font:13px/1.5 "Public Sans",system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#pr h1{font:600 30px Newsreader,Georgia,serif;margin:0;color:#fff}#pr h2{font:600 17px Newsreader,Georgia,serif;color:#0f6b6f;margin:16px 0 6px;padding-bottom:3px;border-bottom:1px solid #d8e1df}
.ph{display:flex;justify-content:space-between;align-items:center;background:#0b3335;color:#fff;padding:14px 18px;border-radius:8px}.ph p{margin:0;color:#8fb3b0;font-size:12px}.pt{text-align:right}.pt b{display:block;font-size:16px}.pt span{color:#cfe3e1}
.pi{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin-top:14px;padding:10px 14px;background:#f3f6f5;border-radius:8px}.pi small{display:block;color:#5d7073;font-size:11px}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.pg div{border:1px solid #d8e1df;border-radius:8px;padding:10px;text-align:center}.pg b{display:block;font:600 24px Newsreader,Georgia,serif;color:#0f6b6f}.pg span{font-size:11px;color:#5d7073}
.pb{display:grid;grid-template-columns:170px 1fr 40px;gap:10px;align-items:center;margin:6px 0}.pb i{display:block;height:9px;background:#e0f0ef;border-radius:5px}.pb u{display:block;height:100%;background:#0f6b6f;border-radius:5px}.pb b{text-align:right}
.pc{margin:0}#pr ul{margin:0;padding-left:20px}.ps{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:34px}.ps div{border-top:1px solid #14282b;padding-top:4px;font-weight:600}.ps small{display:block;font-weight:400;color:#5d7073}
.pf{margin-top:18px;text-align:center;color:#5d7073;font-size:12px}
@media(max-width:860px){#app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}aside h1{font-size:22px}aside .ac{display:none}aside .as{margin:0;padding:0;width:100%}main{padding:18px 14px}.two{grid-template-columns:1fr}}
@media print{aside,.bar,details.add,.noprint{display:none!important}#app{display:block}main{padding:0}}
</style></head>
<body><div id="pr"></div><div id="app"><aside id="side"></aside><main id="main"></main></div>
<script>
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY='2026-10-09',LV=['Noorani Qaida','Nazra','Hifz','Tajweed'];
const mins=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const add=(t,m)=>{const x=mins(t)+m;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};
const fmt=d=>new Date(d+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
const wk=d=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()-((x.getUTCDay()+6)%7));return x.toISOString().slice(0,10)};
const rnd=(()=>{let a=20261009;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}})();
const pick=a=>a[Math.floor(rnd()*a.length)];
const NS=16,DY=['Monday','Tuesday','Wednesday','Thursday','Friday'],RS={'UK/US/Canada':'08:00','Australia/NZ':'12:00','Middle East':'14:00'},CNT=[14,13,12,11,15,10,6,5];
const T=[['Ustadh Hamza','UK/US/Canada'],['Ustadha Maryam','UK/US/Canada'],['Ustadh Ali','UK/US/Canada'],['Ustadha Fatima','Australia/NZ'],['Ustadh Bilal','Middle East'],['Ustadha Khadija','UK/US/Canada'],['Ustadh Yahya','Australia/NZ'],['Ustadha Sumayya','Middle East']].map((x,i)=>({id:i+1,n:x[0],rg:x[1],s:RS[x[1]]}));
const FN=['Ahmed','Aisha','Yusuf','Zainab','Hassan','Maryam','Omar','Fatima','Ibrahim','Khadija','Ali','Amina','Bilal','Hafsa','Idris','Safiya','Zayd','Layla','Hamza','Noor','Musa','Sara','Adam','Hana','Ismail','Ayesha','Saad','Rukhsar','Taha','Iman','Umar','Sumaya','Yahya','Asma','Danish','Eman','Faisal','Huda','Junaid','Mariam'];
const LN=['Khan','Ahmed','Raza','Malik','Siddiqui','Hussain','Sheikh','Qureshi','Chaudhry','Ansari','Patel','Rahman','Farooq','Iqbal','Butt','Mirza','Hashmi','Zaman','Haider','Baig','Saleem','Ghani','Anwar','Latif'];
const MT={'Noorani Qaida':['Urdu Noorani Qaida','English Noorani Qaida'],'Nazra':['Nazra Quran (15 line)'],'Hifz':['Hifz Quran (16 line)'],'Tajweed':['Tajweed Rules']};
const PH={'UK/US/Canada':['+44 7700 900','+1 555 010','+1 416 555'],'Australia/NZ':['+61 412 345','+64 21 555'],'Middle East':['+971 50 123','+966 55 123','+974 55 123']};
const S=[];T.forEach((t,ti)=>{for(let j=0;j<CNT[ti];j++){const i=S.length,f=FN[i%40],l=LN[(i*5+(i/40|0)*7)%24],lv=pick(['Noorani Qaida','Noorani Qaida','Nazra','Nazra','Nazra','Hifz','Tajweed']),q=rnd();
 S.push({id:i+1,n:f+' '+l,t:t.id,lv,p:(rnd()<.5?'Mr. ':'Mrs. ')+l,e:(f+'.'+l).toLowerCase()+'@mail.com',w:pick(PH[t.rg])+' '+(100+Math.floor(rnd()*900)),pf:pick(['Zoom','Zoom','Teams']),zid:f+' '+l[0],m:pick(MT[lv]),st:q<.07?'Trial':q<.13?'Paused':'Active',days:[]})}});
const SC={},SM={};T.forEach(t=>SC[t.id]={g:DY.map(()=>Array(NS).fill(0)),nt:{}});
S.forEach(s=>{SM[s.id]=s;if(s.st==='Paused')return;const g=SC[s.t].g,i0=Math.floor(rnd()*NS);
 for(const d of [pick([[0,1,2,3,4],[0,1,2,3],[0,2,4],[1,3]]),[1,3],[0],[2]])for(let k=0;k<NS;k++){const i=(i0+k)%NS;if(d.every(x=>!g[x][i])){d.forEach(x=>g[x][i]=s.id);s.days=d;s.sl=i;return}}});
SC[1].nt[4]='Makeup class 9 Oct';SC[2].nt[0]='Off';SC[5].nt[2]='Confirm slots with parents';
const SU=['Al-Fatiha','Al-Baqarah','Al-Ikhlas','An-Naba','Al-Mulk'],TJ=['Noon saakin rules','Meem saakin rules','Makharij','Madd rules','Qalqalah'],DU=['First kalma','Second kalma','Dua before eating','Dua for leaving home','Salah: Tashahhud'];
let rid=0;const R=[];
const DT=['2026-10-01','2026-10-02','2026-10-05','2026-10-06','2026-10-07','2026-10-08'],DW=[3,4,0,1,2,3];
S.forEach(s=>DT.forEach((d,k)=>{if(!s.days.includes(DW[k]))return;
 const a=add(T.find(t=>t.id===s.t).s,s.sl*30),n=(s.id+k)%7,ab=rnd()<.05,hn=s.lv==='Hifz'||s.lv==='Nazra';
 const q=s.lv==='Noorani Qaida'?`Lesson ${1+n%4}: ${pick(['single letters','joined letters','harakat','tanween'])}`:hn?`Surah ${SU[n%5]}, ayah ${1+n*3}-${3+n*3}`:TJ[n%5];
 R.push({id:++rid,s:s.id,d,tm:a+'-'+add(a,30),q:ab?'':q,du:ab?'':DU[n%5],su:ab||!hn?'':'Surah '+SU[(n+2)%5]+', ayah 1-'+(5+n),rm:ab?'Absent':pick(['Excellent','Good','Good','Good','Needs more practice']),pf:s.pf,zid:s.zid,m:s.m})}));
const A=[];
T.forEach(t=>DT.forEach((d,i)=>{
 const k=(t.id*3+i*5)%9;
 if(k===0)A.push({t:t.id,d,time:'',st:'Absent'});else if(k===1)A.push({t:t.id,d,time:'',st:'Leave'});
 else A.push({t:t.id,d,time:add(t.s,[0,0,10,5,0,15][(t.id+i)%6]),st:'Present'});}));
const late=(t,x)=>x&&x.st==='Present'&&x.time?Math.max(0,mins(x.time)-mins(t.s)):0;
const NAV={teacher:[['cls','My classes'],['students','My students']],manager:[['tt','Teacher timetables'],['att','Teacher attendance'],['dir','Student directory'],['rep','Student reports']],admin:[['ov','Overview'],['tt','Teacher timetables'],['att','Teacher attendance'],['dir','Student directory'],['rep','Student reports']]};
let role='teacher',view='cls',me=1,sel=1,tf=0,tt2=1,nw=0,lastV='',lastS=0,SL=null;const TD=(new Date(TODAY+'T00:00:00Z').getUTCDay()+6)%7;
const $=id=>document.getElementById(id);
function setRole(x){role=x;view=NAV[x][0][0];render()}
function go(v){view=v;render()}
function selS(id){sel=id;render()}
function side(){
 $('side').innerHTML=`<h1>Sabaq</h1><p class="ac">Al-Noor Online Academy (sample data)</p>`+
 NAV[role].map(n=>`<button class="${view===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')+
 `<div class="as">View as<div class="sw">${['teacher','manager','admin'].map(x=>`<button class="${role===x?'on':''}" onclick="setRole('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div>`}
function head(h,s){return `<h1>${h}</h1><p class="sub">${s}</p>`}
function pane(list){
 if(!list.find(x=>x.id===sel))sel=list.length?list[0].id:0;
 if(!list.length)return '<p class="empty">No students assigned yet.</p>';
 return `<div class="two"><div class="list">${list.map(s=>`<button class="st ${s.id===sel?'on':''}" onclick="selS(${s.id})"><b>${E(s.n)}</b><span>${E(s.lv)}</span><small>${R.filter(x=>x.s===s.id).length} lessons logged</small></button>`).join('')}</div><div>${report(sel)}</div></div>`}
function report(id){
 const s=S.find(x=>x.id===id);if(!s)return '<p class="empty">Choose a student to see their report.</p>';
 const rows=R.filter(x=>x.s===id).sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id),tc=T.find(t=>t.id===s.t);let body='',pw=null;
 const ce=(x,k)=>`<td contenteditable="true" onblur="ed(${x.id},'${k}',this.textContent)">${E(x[k])}</td>`;
 rows.forEach(x=>{const w=wk(x.d);if(pw&&w!==pw)body+='<tr class="eow"><td colspan="8">End of week</td></tr>';pw=w;
  body+=`<tr${x.id===nw?' data-new':''}><td><input type="date" value="${E(x.d)}" onchange="ed(${x.id},'d',this.value);render()"></td>${ce(x,'tm')}${ce(x,'q')}${ce(x,'du')}${ce(x,'su')}${ce(x,'rm')}<td><select onchange="ed(${x.id},'pf',this.value)">${['Zoom','Teams'].map(o=>`<option${x.pf===o?' selected':''}>${o}</option>`).join('')}</select><div contenteditable="true" onblur="ed(${x.id},'zid',this.textContent)">${E(x.zid)}</div></td>${ce(x,'m')}</tr>`});
 return `<div class="rh"><div><h2>${E(s.n)}</h2><p>${E(s.lv)}, taught by ${E(tc.n)}</p></div><div class="chips"><span class="chip">${E(s.pf)}</span><span class="chip">ID name: ${E(s.zid)}</span><span class="chip">${E(s.m)}</span><button class="btn pp noprint" onclick="printParent()">Print for parents</button></div></div>
 <div class="noprint" style="margin-bottom:12px"><button class="btn" onclick="addLesson()">+ Add lesson for today</button> <span class="hint">Date, time, platform, ID name and material are filled in for you. Change any cell.</span></div>
 <div class="wrap"><table class="rt"><thead><tr><th>Date</th><th>Time</th><th>Qaida / Quran lesson</th><th>Duas / Salah lesson</th><th>Memorization of surahs</th><th>Remarks</th><th>Teams / Zoom ID name</th><th>Material used</th></tr></thead><tbody>${body||'<tr><td colspan="8" class="empty">No lessons yet. Use Add lesson to log the first one.</td></tr>'}</tbody></table></div>
 <p class="hint">Click any cell to edit it.</p>`}
function printParent(){
 const s=S.find(y=>y.id===sel);if(!s)return;const t=T.find(y=>y.id===s.t),f=s.n.split(' ')[0],mo=new Date(TODAY+'T00:00:00Z').toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});
 const bar=(l,v)=>`<div class="pb"><span>${l}</span><i><u style="width:${v}%"></u></i><b>${v}%</b></div>`;
 $('pr').innerHTML=`<div class="pbar"><button class="btn" onclick="try{window.print()}catch(e){}">Print / Save as PDF</button><button class="btn ghost" onclick="closeP()">Close</button><span class="hint">If Print does nothing, press Ctrl+P (Cmd+P on Mac).</span></div><div class="sheet"><div class="ph"><div><h1>Sabaq</h1><p>Al-Noor Online Academy</p></div><div class="pt"><b>Monthly progress report</b><span>${mo}</span></div></div>
 <div class="pi"><div><small>Student</small><b>${E(s.n)}</b></div><div><small>Teacher</small><b>${E(t.n)}</b></div><div><small>Level</small><b>${E(s.lv)}</b></div><div><small>Material</small><b>${E(s.m)}</b></div></div>
 <h2>This month at a glance</h2>
 <div class="pg"><div><b>18</b><span>Classes attended</span></div><div><b>90%</b><span>Attendance</span></div><div><b>42</b><span>Lessons completed</span></div><div><b>Good</b><span>Overall progress</span></div></div>
 <h2>Progress by area</h2>${bar('Reading and recitation',80)}${bar('Memorization',70)}${bar('Duas and Salah',85)}${bar('Pronunciation (Tajweed)',65)}${bar('Focus and punctuality',90)}
 <h2>Teacher's comments</h2><p class="pc">Alhamdulillah, ${E(f)} has shown steady effort this month and is attending classes with a good attitude. Reading is becoming smoother and revision is improving. With regular practice at home, we expect further progress next month.</p>
 <h2>Focus for next month</h2><ul><li>Revise the last three lessons for 10 minutes every day.</li><li>Practise correct pronunciation of the letters from the Makharij lessons.</li><li>Join class on time and keep the Zoom or Teams name unchanged.</li></ul>
 <div class="ps"><div>${E(t.n)}<small>Teacher</small></div><div>Academy office<small>Sabaq</small></div></div>
 <p class="pf">JazakAllahu khayran for your support. For any questions, please contact us on WhatsApp.</p></div>`;
 $('pr').classList.add('show')}
function closeP(){$('pr').classList.remove('show')}
function ed(id,k,v){const x=R.find(y=>y.id===id);if(x)x[k]=v.trim()}
function addLesson(){const s=S.find(x=>x.id===sel);if(!s)return;const t=T.find(y=>y.id===s.t),i=(SC[s.t].g[TD]||[]).indexOf(s.id),a=i<0?'':add(t.s,i*30);
 R.push({id:++rid,s:s.id,d:TODAY,tm:i<0?'':a+'-'+add(a,30),q:'',du:'',su:'',rm:'',pf:s.pf,zid:s.zid,m:s.m});nw=rid;render()}
function tsel(){return `<select onchange="tf=+this.value;render()"><option value="0">All teachers</option>${T.map(t=>`<option value="${t.id}"${tf===t.id?' selected':''}>${E(t.n)}</option>`).join('')}</select>`}
function attView(){
 const rows=T.map(t=>{const x=A.find(a=>a.t===t.id&&a.d===TODAY),l=late(t,x);
  const res=!x||!x.st?'<span class="b n">Not marked</span>':x.st==='Absent'?'<span class="b bad">Absent</span>':x.st==='Leave'?'<span class="b warn">On leave</span>':!x.time?'<span class="b n">Enter time</span>':l?`<span class="b warn">Late ${l} min</span>`:'<span class="b ok">On time</span>';
  return `<tr><td><b>${E(t.n)}</b></td><td>${t.s}</td><td><input type="time" value="${x?x.time:''}" onchange="setAtt(${t.id},'time',this.value)"></td><td><select onchange="setAtt(${t.id},'st',this.value)">${['','Present','Absent','Leave'].map(o=>`<option value="${o}"${x&&x.st===o?' selected':''}>${o||'Not marked'}</option>`).join('')}</select></td><td>${res}</td></tr>`}).join('');
 return head('Teacher attendance','Friday, 9 October 2026. Enter the time each teacher joined; lateness is worked out from their scheduled start.')+
 `<div class="wrap"><table><thead><tr><th>Teacher</th><th>Scheduled start</th><th>Joined at</th><th>Status</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table></div><p class="hint">Entries feed the admin's monthly overview automatically.</p>`}
function setAtt(tid,k,v){let x=A.find(a=>a.t===tid&&a.d===TODAY);if(!x){x={t:tid,d:TODAY,time:'',st:''};A.push(x)}
 x[k]=v;if(k==='time'&&v&&!x.st)x.st='Present';if(k==='st'&&(v==='Absent'||v==='Leave'))x.time='';render()}
function dirRows(q){q=(q||'').toLowerCase();return S.filter(s=>[s.n,s.p,s.e,s.w,s.lv].join(' ').toLowerCase().includes(q)).map(s=>`<tr><td><b>${E(s.n)}</b></td><td>${E(s.p)}</td><td>${E(s.e)}</td><td><a href="https://wa.me/${s.w.replace(/\D/g,'')}" target="_blank" rel="noopener">${E(s.w)}</a></td><td>${E(T.find(t=>t.id===s.t).n)}</td><td>${E(s.lv)}</td><td>${E(s.pf)}</td><td><span class="b ok">${E(s.st)}</span></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No student matches that search.</td></tr>'}
function dirView(){
 return head('Student directory','Contact details stay here; teachers only see names and levels.')+
 `<div class="bar"><input type="search" placeholder="Search students" oninput="$('db').innerHTML=dirRows(this.value)" aria-label="Search students"></div>
 <details class="add"><summary>Add student</summary><div class="fg">
 <label>Student name<input id="sn"></label><label>Parent / guardian<input id="sp"></label><label>Email<input id="se" type="email"></label><label>WhatsApp number<input id="sw"></label>
 <label>Teacher<select id="st">${T.map(t=>`<option value="${t.id}">${E(t.n)}</option>`).join('')}</select></label>
 <label>Level<select id="sl">${LV.map(l=>`<option>${l}</option>`).join('')}</select></label>
 <label>Platform<select id="sf"><option>Zoom</option><option>Teams</option></select></label><label>Zoom / Teams ID name<input id="sz"></label></div>
 <button class="btn" onclick="addStudent()">Save student</button><span class="err" id="serr"></span></details>
 <div class="wrap"><table style="min-width:900px"><thead><tr><th>Student</th><th>Parent / guardian</th><th>Email</th><th>WhatsApp</th><th>Teacher</th><th>Level</th><th>Platform</th><th>Status</th></tr></thead><tbody id="db">${dirRows('')}</tbody></table></div>`}
function addStudent(){const g=i=>$(i).value.trim();
 if(!g('sn')||!g('sw')){$('serr').textContent='Add the student name and a WhatsApp number.';return}
 S.push({id:S.length+1,n:g('sn'),t:+g('st'),lv:g('sl'),p:g('sp'),e:g('se'),w:g('sw'),pf:g('sf'),zid:g('sz')||g('sn'),m:'',st:'Active',days:[]});render()}
function who(){return `<div class="bar"><label>Signed in as&nbsp;<select onchange="me=+this.value;sel=0;render()">${T.map(t=>`<option value="${t.id}"${me===t.id?' selected':''}>${E(t.n)}</option>`).join('')}</select></label></div>`}
function openS(id){const s=SM[id];sel=id;if(role==='teacher'){me=s.t;view='students'}else{tf=s.t;view='rep'}render()}
function tt(id){const t=T.find(y=>y.id===id),g=SC[id].g,n=g.flat().filter(Boolean).length,mine=S.filter(s=>s.t===id&&s.st!=='Paused').length,em=role!=='teacher';
 const H=Array.from({length:NS},(_,i)=>{const a=add(t.s,i*30);return `<th>${a}<br><small>${add(a,30)}</small></th>`}).join('');
 const B=DY.map((d,di)=>`<tr class="${di===TD?'today':''}"><th class="dy">${d}${di===TD?'<small>Today</small>':''}</th>${g[di].map((sid,i)=>{const s=sid&&SM[sid],oc=em?`openSlot(${id},${di},${i})`:s?`openS(${s.id})`:'';return s?`<td class="c ${s.st==='Trial'?'ty':'pk'}" onclick="${oc}" title="${E(s.n)}, ${E(s.lv)}">${E(s.n)}</td>`:`<td class="c gr${em?' ed':''}"${em?` onclick="${oc}"`:''}>Free</td>`}).join('')}<td class="nt" contenteditable="true" onblur="SC[${id}].nt[${di}]=this.textContent.trim()">${E(SC[id].nt[di]||'')}</td></tr>`).join('');
 return `<div class="ttb">${E(t.rg)} &middot; ${E(t.n)}</div><div class="chips" style="margin:10px 0"><span class="chip">${mine} students</span><span class="chip">${n} classes a week</span><span class="chip">${NS*5-n} free slots</span><span class="chip" style="background:#9bbb59;color:#1d2a1f">Free</span><span class="chip" style="background:#e59a9a;color:#1d2a1f">Booked</span><span class="chip" style="background:#ffe94d;color:#1d2a1f">Trial class</span></div>
 <div class="wrap"><table class="tt"><thead><tr><th class="dy">Day</th>${H}<th>Notes</th></tr></thead><tbody>${B}</tbody></table></div><p class="hint">${em?'Click any slot to assign a student, change it, or make it free. Click a note to edit it.':"Each slot is 30 minutes. Click a booked slot to open that student's report. Click a note to edit it."}</p>`}
function openSlot(t,d,i){SL={t,d,i};render()}
function closeSlot(){SL=null;render()}
function saveSlot(){const v=+$('ss').value,g=SC[SL.t].g;DY.forEach((_,d)=>{if($('sd'+d).checked)g[d][SL.i]=v});SL=null;render()}
function slotModal(){const t=T.find(y=>y.id===SL.t),cur=SC[SL.t].g[SL.d][SL.i],a=add(t.s,SL.i*30);
 return `<div class="mo" onclick="if(event.target===this)closeSlot()"><div class="mc"><h2 style="font-size:22px">Edit class</h2><p class="sub" style="margin-bottom:12px">${E(t.n)}, ${DY[SL.d]} ${a}-${add(a,30)}</p>
 <label class="ml">Student<select id="ss"><option value="0">Free (no class)</option>${S.filter(s=>s.t===SL.t&&s.st!=='Paused').map(s=>`<option value="${s.id}"${s.id===cur?' selected':''}>${E(s.n)} (${E(s.lv)})</option>`).join('')}</select></label>
 <div class="ml">Apply to days<div class="dys">${DY.map((d,k)=>`<label><input type="checkbox" id="sd${k}"${k===SL.d?' checked':''}> ${d.slice(0,3)}</label>`).join('')}</div></div>
 <div class="bar" style="margin:14px 0 0"><button class="btn" onclick="saveSlot()">Save</button><button class="btn ghost" onclick="closeSlot()">Cancel</button></div></div></div>`}
function bars(t,rows){const m=Math.max(...rows.map(r=>r[1]),1);return `<div><h2 style="font-size:20px;margin-bottom:8px">${t}</h2>${rows.map(r=>`<div class="br"><span>${E(r[0])}</span><i style="width:${r[1]/m*100}%"></i><b>${r[1]}</b></div>`).join('')}</div>`}
function ovView(){
 const c=f=>S.filter(f).length,wc=T.reduce((n,t)=>n+SC[t.id].g.flat().filter(Boolean).length,0),cap=T.length*NS*5,n=(l,v)=>`<div><b>${v}</b><span>${l}</span></div>`;
 const L=A.filter(a=>late(T.find(t=>t.id===a.t),a)>0).length,nm=T.filter(t=>!A.find(a=>a.t===t.id&&a.d===TODAY&&a.st)).length;
 const rows=T.map(t=>{const rc=A.filter(a=>a.t===t.id),pr=rc.filter(a=>a.st==='Present'),lt=pr.filter(a=>late(t,a)>0),bk=SC[t.id].g.flat().filter(Boolean).length;
  return `<tr><td><b>${E(t.n)}</b></td><td>${t.rg}</td><td>${c(s=>s.t===t.id)}</td><td>${bk}</td><td>${Math.round(bk/(NS*5)*100)}%</td><td>${pr.length}</td><td>${lt.length}</td><td>${pr.reduce((m,a)=>m+late(t,a),0)} min</td><td>${rc.filter(a=>a.st==='Absent').length}</td><td>${rc.filter(a=>a.st==='Leave').length}</td></tr>`}).join('');
 return head('Overview','October 2026, across all teachers and students (sample data).')+
 `<div class="nums">${n('Total students',S.length)}${n('Active',c(s=>s.st==='Active'))}${n('On trial',c(s=>s.st==='Trial'))}${n('Paused',c(s=>s.st==='Paused'))}${n('Teachers',T.length)}${n('Classes per week',wc)}${n('Slots booked',Math.round(wc/cap*100)+'%')}${n('Late arrivals this month',L)}${n('Teachers not marked today',nm)}</div>
 <div class="two2">${bars('Students by level',LV.map(l=>[l,c(s=>s.lv===l)]))}${bars('Students by region',Object.keys(RS).map(r=>[r,c(s=>T.find(t=>t.id===s.t).rg===r)]))}</div>
 <h2 style="font-size:22px;margin-bottom:10px">Teachers: workload and attendance this month</h2>
 <div class="wrap"><table style="min-width:900px"><thead><tr><th>Teacher</th><th>Region</th><th>Students</th><th>Weekly classes</th><th>Slots booked</th><th>Days present</th><th>Late days</th><th>Total late time</th><th>Absent</th><th>On leave</th></tr></thead><tbody>${rows}</tbody></table></div>
 <p class="hint">The admin can also open timetables, attendance, the directory, and every report from the menu.</p>`}
function render(){
 const m=$('main'),q=s=>document.querySelector(s),L0=q('.two>.list'),R0=q('.two>div:last-child'),st=[m.scrollTop,L0?L0.scrollTop:0,R0?R0.scrollTop:0];
 side();let h='';
 if(view==='cls')h=head('My classes','Your weekly timetable.')+who()+tt(me);
 else if(view==='tt')h=head('Teacher timetables',role==='teacher'?'Weekly classes and free slots.':'Pick a teacher, then click any slot to assign, change or free up a class.')+`<div class="bar"><label>Teacher&nbsp;<select onchange="tt2=+this.value;render()">${T.map(t=>`<option value="${t.id}"${tt2===t.id?' selected':''}>${E(t.n)}</option>`).join('')}</select></label></div>`+tt(tt2);
 else if(view==='students'){const l=S.filter(s=>s.t===me);h=head('My students','Each student has their own report. Pick one to view or add lessons.')+who()+pane(l)}
 else if(view==='rep')h=head('Student reports','Every student, across all teachers.')+`<div class="bar">${tsel()}</div>`+pane(S.filter(s=>!tf||s.t===tf));
 else if(view==='att')h=attView();else if(view==='dir')h=dirView();else h=ovView();
 if(SL)h+=slotModal();
 m.innerHTML=h;m.className=['students','rep','dir'].includes(view)?'fit':'';
 const L1=q('.two>.list'),R1=q('.two>div:last-child');
 if(lastV===view){m.scrollTop=st[0];if(L1)L1.scrollTop=st[1];if(R1&&lastS===sel)R1.scrollTop=st[2]}
 lastV=view;lastS=sel;
 const n=q('tr[data-new] td:nth-child(3)');if(n){nw=0;n.scrollIntoView({block:'nearest'});n.focus()}}

render();
</script></body></html>
